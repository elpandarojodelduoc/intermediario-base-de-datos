spring.application.name=pasteleria

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pasteleria?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html

app.jwt.secret=${JWT_SECRET:clave-solo-para-desarrollo-cambiar-en-produccion-32chars}
app.jwt.access-expiration-minutes=${JWT_ACCESS_MINUTES:15}
app.jwt.refresh-expiration-days=${JWT_REFRESH_DAYS:7}

app.cors.allowed-origins=http://localhost:5173,http://localhost:4173

app.seed.admin-password=${SEED_ADMIN_PASSWORD:admin123}

server.error.include-message=always
server.port=8080
