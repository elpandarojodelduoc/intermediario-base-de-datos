spring.application.name=pasteleria

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pasteleria?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:pasteleria_user}
spring.datasource.password=${DB_PASSWORD:Duoc.2025}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html

app.cors.allowed-origins=http://localhost:5173,http://localhost:4173

server.port=8080
server.address=127.0.0.1
server.forward-headers-strategy=framework

server.servlet.context-path=/api